# Minimal end-to-end experiment against the built-in simulator.
#   python -m disteval experiment configs/demo.yaml
experiment:
  name: demo
  description: Smallest useful run of the evaluate -> select -> train -> re-evaluate loop.
  seed: 42
  n_seeds: 3

evaluation:
  runs_per_task: 8
  adaptive_sampling: false
  min_runs_per_task: 3

reliability:
  model: hierarchical
  backend: laplace
  prior: jeffreys
  credible_level: 0.95
  tau_cap: 0.15
  tau_rel: 0.90
  tau_stuck: 0.10
  confidence: 0.80
  recoverability_estimator: headroom

selection:
  # "all" compares every strategy; name one strategy to run only it.
  method: all
  n_tasks: 30
  n_pairs: 80
  max_pairs_per_task: 4

training:
  backend: simulated

split:
  strategy: domain_holdout
  test_fraction: 0.3
