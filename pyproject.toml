[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disteval"
version = "0.1.0"
description = "Distributional evaluation and reliability-aware post-training for long-horizon AI agents"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "agents", "evaluation", "reinforcement-learning", "dpo", "training"]
authors = [
    {name = "Shikhar Sehgal", email = "SHIKHARSEHGAL@uchicago.edu"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pyarrow",
    "pyyaml",
    "scikit-learn",
]

[project.optional-dependencies]
inspect = ["inspect-ai"]
rliable = ["rliable"]
dev = ["pytest", "pytest-cov", "black", "ruff", "hypothesis"]

[project.urls]
Homepage = "https://github.com/shikharsehgal1/dist-eval-shikhar"
Documentation = "https://github.com/shikharsehgal1/dist-eval-shikhar#readme"

[project.scripts]
disteval = "disteval.__main__:main"
disteval-report = "disteval.report:main"
disteval-compare = "disteval.compare_report:main"
disteval-sim = "disteval.training_sim:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["disteval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: tests that touch external frameworks or filesystem fixtures",
    "slow: tests that take more than a few seconds",
    "requires_harbor: tests that require real Harbor job directories",
]

[tool.coverage.run]
source = ["disteval"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Correctness-focused rule set, pinned so `ruff check` is a gate rather than a
# wall of style opinions. Newer ruff defaults enable a much broader set (pep604
# annotation rewrites, dunder-all sorting and so on) which would churn the whole
# legacy tree without catching a single bug.
[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes: undefined names, unused imports and variables
    "W",     # pycodestyle warnings
    "B",     # bugbear: mutable defaults, loop-variable binding, ...
    "SIM",   # obvious simplifications
    "C4",    # comprehension misuse
    "PIE",   # misc lints
    "RET",   # unreachable / redundant returns
]
ignore = [
    "E501",    # line length is handled by the formatter
    "E741",    # single-letter names are fine in numerical code (l, I, O)
    "B008",    # function call in default arg: used deliberately for priors
    "SIM108",  # ternary-vs-if is a readability judgement, not a rule
    "SIM105",  # contextlib.suppress is not always clearer than try/except/pass
    "RET504",  # naming a value before returning it often aids readability
    "RET505",  # else-after-return reads fine in short branching logic
    # zip(strict=) does catch length mismatches, but every zip in this tree is
    # over provably equal-length sequences (parallel arrays validated at their
    # entry points), and retrofitting 46 call sites across the legacy modules
    # would be churn without fixing a bug. Revisit if a mismatch ever bites.
    "B905",
    "B007",    # unused loop variables are often the clearest way to write a count
    "B028",    # warnings without stacklevel: these are user-facing, not library-internal
]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the point of a package __init__.
"**/__init__.py" = ["F401"]
# Tests deliberately import for side effects and use bare asserts.
"tests/**" = ["B011"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]